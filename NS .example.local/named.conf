statistics-channels {
    inet 0.0.0.0 port 8053 allow { 127.0.0.1; 172.17.0.1; 172.20.0.1; };
};


options {
    directory "/var/cache/bind";

    recursion no;
    listen-on { any; };
    dnssec-validation yes;
    minimal-responses no;
    auth-nxdomain no;
    forwarders { };
    try-tcp-refresh no;
    edns-udp-size 1232;
    max-udp-size  65535;
};

logging {
    channel log {
        file "/usr/local/etc/bind/log";
	severity debug 3;
	print-time yes;
	print-severity yes;
	print-category yes;
    };
    channel query_log {
        file "/tmp/query.log" versions 3 size 10m;
        severity info 3; 
        print-time yes;
        print-category yes;
    };
    category default {
         log;
    };
    category queries { 
        query_log; 
    };
};

zone "example.local." IN {
    type master;
    file "/usr/local/etc/bind/zones/db.example.local.signed";
};
