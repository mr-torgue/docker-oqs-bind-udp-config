statistics-channels {
    inet 0.0.0.0 port 8053 allow { 127.0.0.1; 172.17.0.1; 172.20.0.1; };
};

options {
    directory "/var/cache/bind";

    recursion yes;
    allow-recursion { any; };
    listen-on { any; };
    dnssec-validation yes;
    minimal-responses no;
    auth-nxdomain no;
    resolver-query-timeout 30000;
    resolver-retry-interval 30000;
    resolver-nonbackoff-tries 1;
    send-cookie no;
    try-tcp-refresh no;
    edns-udp-size 1232;
    max-udp-size 1232;
};

logging {
    channel log {
        file "/usr/local/etc/bind/log";
        severity debug 3;
        print-time yes;
        print-severity yes;
        print-category yes;
    };
    channel query_log {
        file "/tmp/query.log" versions 3 size 10m;
        severity debug 3; 
        print-time yes;
        print-category yes;
    };
    category default {
         log;
    };
    category queries { 
        query_log; 
    };
};

zone "." IN {
    type hint;
    file "/usr/local/etc/bind/root/hints/root.hints";
};

trust-anchors {
    example. static-ds 17125 8 2  "1b6b399005d71268535337bc7fc395ea80c9074a6bd298756ef30a86 8cb77515";
};

